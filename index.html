<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAVA X PANEL</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #ff3d00, #ff9800);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

.container {
    width: 100%;
    max-width: 360px;
    padding: 15px;
}

.card {
    background: rgba(0,0,0,0.35);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 0 25px rgba(255,80,0,0.8);
    backdrop-filter: blur(6px);
}

h1 {
    text-align: center;
    margin: 0 0 16px;
    color: #fff;
    font-size: 22px;
    letter-spacing: 1px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    outline: none;
    font-size: 15px;
    margin-bottom: 14px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(90deg, #ff5722, #ff9800);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
}

.toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.08);
    padding: 12px 14px;
    border-radius: 14px;
    margin-bottom: 10px;
    color: #fff;
    font-size: 14px;
}

.switch {
    width: 44px;
    height: 24px;
    background: #555;
    border-radius: 20px;
    position: relative;
}

.switch::after {
    content: '';
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: 0.25s;
}

input[type="checkbox"] {
    display: none;
}

input[type="checkbox"]:checked + .switch {
    background: #00e676;
}

input[type="checkbox"]:checked + .switch::after {
    transform: translateX(20px);
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div class="card" id="login">
        <h1>LAVA X PANEL</h1>
        <input type="password" id="key" placeholder="ใส่รหัสเพื่อเข้า">
        <button onclick="unlock()">UNLOCK</button>
    </div>

    <!-- PANEL -->
    <div class="card hidden" id="panel">
        <h1>LAVA X PANEL</h1>

        <div class="toggle">AIMBOT 80%
            <label>
                <input type="checkbox">
                <span class="switch"></span>
            </label>
        </div>

        <div class="toggle">AIMBOT 120%
            <label>
                <input type="checkbox">
                <span class="switch"></span>
            </label>
        </div>

        <div class="toggle">AIMLOCK 90%
            <label>
                <input type="checkbox">
                <span class="switch"></span>
            </label>
        </div>

        <div class="toggle">ANTIBAN
            <label>
                <input type="checkbox">
                <span class="switch"></span>
            </label>
        </div>

        <div class="toggle">ANTIBLACK
            <label>
                <input type="checkbox">
                <span class="switch"></span>
            </label>
        </div>

        <div class="toggle">AUTO AIM
            <label>
                <input type="checkbox">
                <span class="switch"></span>
            </label>
        </div>
    </div>

</div>

<script>
function unlock() {
    const key = document.getElementById("key").value;
    if (key === "Lava-187OiLMK") {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("panel").classList.remove("hidden");
        alert("🔥 LAVA X PANEL พร้อมใช้งาน 🔥");
    } else {
        alert("❌ รหัสไม่ถูกต้อง");
    }
}
</script>

</body>
  </html>
